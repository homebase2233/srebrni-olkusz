

media:
  input: media
  output: /srebrni-olkusz/media

content:
  - name: aktualnosci
    label: Aktualności
    type: collection
    path: _aktualnosci
    format: yaml-frontmatter
    fields:
      - name: title
        label: Tytuł aktualności
        type: string
        required: true

      - name: date
        label: Data publikacji
        type: date

      - name: image
        label: Zdjęcie główne
        type: image

      - name: description
        label: Krótki opis
        type: text

      - name: body
        label: Treść aktualności
        type: rich-text
        
  - name: galerie
    label: Galerie zdjęć
    type: collection
    path: _galerie
    format: yaml-frontmatter
    fields:
      - name: title
        label: Nazwa albumu
        type: string
        required: true

      - name: date
        label: Data wydarzenia
        type: date

      - name: cover
        label: Zdjęcie główne albumu
        type: image

      - name: description
        label: Opis albumu
        type: text

      - name: photos
        label: Zdjęcia w albumie
        type: image
        list: true

  - name: druzyny
    label: Drużyny i trenerzy
    type: collection
    path: _druzyny
    format: yaml-frontmatter
    fields:
      - name: title
        label: Nazwa drużyny
        type: string
        required: true

      - name: rocznik
        label: Rocznik
        type: number

      - name: image
        label: Zdjęcie drużyny
        type: image

      - name: trener
        label: Imię i nazwisko trenera
        type: string

      - name: trener_zdjecie
        label: Zdjęcie trenera
        type: image

      - name: treningi
        label: Harmonogram treningów
        type: text

      - name: opis
        label: Opis drużyny
        type: rich-text

  - name: trenerzy
    label: Kadra trenerska
    type: collection
    path: _trenerzy
    format: yaml-frontmatter
    fields:
      - name: title
        label: Imię i nazwisko
        type: string
        required: true

      - name: image
        label: Zdjęcie trenera
        type: image

      - name: licencja
        label: Licencja trenerska
        type: string

      - name: roczniki
        label: Prowadzone roczniki
        type: string

      - name: funkcja
        label: Funkcja w akademii
        type: string

      - name: opis
        label: Doświadczenie i opis
        type: rich-text

