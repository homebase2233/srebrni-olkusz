
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | AP Srebrni Olkusz</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

  <style>
    .album-page {
      max-width: 1200px;
      margin: 50px auto;
      padding: 0 20px;
      color: #222;
    }

    .album-page h1 {
      font-size: clamp(28px, 4vw, 44px);
      color: #181818;
      text-shadow: none;
    }

    .album-date {
      color: #d71920;
      font-weight: bold;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      margin: 35px 0;
    }

    .photo-grid button {
      background: #f3f3f3;
      border: none;
      padding: 0;
      cursor: pointer;
      overflow: hidden;
      border-radius: 6px;
    }

    .photo-grid img {
      display: block;
      width: 100%;
      height: 240px;
      object-fit: cover;
      transition: transform .2s;
    }

    .photo-grid button:hover img {
      transform: scale(1.04);
    }

    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,.95);
      align-items: center;
      justify-content: center;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
    }

    .lightbox button {
      position: absolute;
      background: rgba(255,255,255,.15);
      color: white;
      border: 0;
      border-radius: 5px;
      padding: 12px 17px;
      font-size: 25px;
      cursor: pointer;
    }

    .close-photo { top: 20px; right: 20px; }
    .prev-photo { left: 15px; top: 50%; }
    .next-photo { right: 15px; top: 50%; }

    @media(max-width: 800px) {
      .photo-grid { grid-template-columns: repeat(2, 1fr); }
      .photo-grid img { height: 170px; }
    }

    @media(max-width: 480px) {
      .photo-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .photo-grid img { height: 130px; }
    }
    
.photo-tools {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  color: white;
  font-size: 15px;
  white-space: nowrap;
}

.download-photo {
  color: white;
  background: #d71920;
  padding: 11px 18px;
  border-radius: 5px;
  font-weight: bold;
  font-size: 12px;
}

  </style>
</head>
<body>

<header class="header">
  <a href="{{ '/' | relative_url }}" class="logo">
    <img src="{{ '/herb.png' | relative_url }}" alt="Herb AP Srebrni Olkusz">
    <span>AP SREBRNI OLKUSZ</span>
  </a>
  <nav class="nav" style="display:flex">
    <a href="{{ '/' | relative_url }}">Strona główna</a>
    <a href="{{ '/#galeria' | relative_url }}">Galeria</a>
  </nav>
</header>

<main class="album-page">
  <p class="album-date">{{ page.date | date: "%d.%m.%Y" }}</p>
  <h1>{{ page.title | escape }}</h1>
  <p>{{ page.description | escape }}</p>

  <div class="photo-grid" id="photoGrid">
    {% for photo in page.photos %}
      {% assign photo_url = photo.src | default: photo.image | default: photo %}
      <button type="button" class="photo-item"
              aria-label="Powiększ zdjęcie {{ forloop.index }}">
        <img src="{{ photo_url | escape }}"
             alt="Zdjęcie {{ forloop.index }} z albumu {{ page.title | escape }}"
             loading="lazy">
      </button>
    {% endfor %}
  </div>

  <a href="{{ '/#galeria' | relative_url }}" class="btn">
    POWRÓT DO GALERII
  </a>
</main>

<div class="lightbox" id="lightbox" role="dialog"
     aria-modal="true" aria-label="Podgląd zdjęcia">
  <button class="close-photo" id="closePhoto" aria-label="Zamknij">×</button>
  <button class="prev-photo" id="prevPhoto" aria-label="Poprzednie zdjęcie">‹</button>
  <img id="largePhoto" alt="Powiększone zdjęcie">
  
<div class="photo-tools">
  <span id="photoCounter" aria-live="polite"></span>
  <a id="downloadPhoto" class="download-photo" href="#" download>
    POBIERZ ZDJĘCIE
  </a>
</div>

  <button class="next-photo" id="nextPhoto" aria-label="Następne zdjęcie">›</button>
</div>

<script>
  const photos = Array.from(
    document.querySelectorAll(".photo-item img")
  );
  const lightbox = document.getElementById("lightbox");
  const largePhoto = document.getElementById("largePhoto");
  let current = 0;

  function showPhoto(index) {
    if (!photos.length) return;
    current = (index + photos.length) % photos.length;
    largePhoto.src = photos[current].src;
    largePhoto.alt = photos[current].alt;
    
document.getElementById("photoCounter").textContent =
  `${current + 1} z ${photos.length}`;

document.getElementById("downloadPhoto").href =
  photos[current].src;

    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closePhoto() {
    lightbox.classList.remove("open");
    largePhoto.removeAttribute("src");
    document.body.style.overflow = "";
  }

  photos.forEach((photo, index) => {
    photo.parentElement.addEventListener("click", () => showPhoto(index));
  });

  document.getElementById("closePhoto").onclick = closePhoto;
  document.getElementById("prevPhoto").onclick = () => showPhoto(current - 1);
  document.getElementById("nextPhoto").onclick = () => showPhoto(current + 1);

  lightbox.addEventListener("click", event => {
    if (event.target === lightbox) closePhoto();
  });

  document.addEventListener("keydown", event => {
    if (!lightbox.classList.contains("open")) return;
    if (event.key === "Escape") closePhoto();
    if (event.key === "ArrowLeft") showPhoto(current - 1);
    if (event.key === "ArrowRight") showPhoto(current + 1);
  });
</script>

</body>
</html>
